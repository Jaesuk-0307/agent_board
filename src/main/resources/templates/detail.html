<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('게시글')}"></head>
<body>
<header class="hero">
    <h1><a href="/">✨ 게시판</a></h1>
</header>
<main class="container">
    <article class="card">
        <h2 class="post-title" th:text="${post.title}">제목</h2>
        <div class="meta">
            <span>👤 <span th:text="${post.name}">이름</span></span>
            <span>🕒 <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span></span>
        </div>
        <div class="body" th:text="${post.content}">내용</div>
        <div class="actions">
            <a class="btn ghost" th:href="@{/(page=${page})}">목록</a>
            <a class="btn ghost" th:href="@{/posts/{id}/edit(id=${post.id})}">수정</a>
            <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post"
                  onsubmit="return confirm('정말 삭제하시겠습니까?');">
                <button class="btn danger" type="submit">삭제</button>
            </form>
        </div>
    </article>
</main>
</body>
</html>
