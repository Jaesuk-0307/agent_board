<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">게시판</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --primary-dark: #4f46e5; --danger: #ef4444;
            --text: #1f2937; --muted: #6b7280; --border: #e5e7eb; --card: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; color: var(--text);
            font-family: 'Noto Sans KR', system-ui, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f5f3ff 50%, #fdf2f8 100%);
        }
        .hero { text-align: center; padding: 56px 16px 28px; }
        .hero h1 { margin: 0; font-size: 2.2rem; font-weight: 700;
            background: linear-gradient(90deg, #6366f1, #ec4899); -webkit-background-clip: text;
            background-clip: text; color: transparent; }
        .hero h1 a { text-decoration: none; color: inherit; }
        .hero p { margin: 8px 0 0; color: var(--muted); }
        .container { max-width: 860px; margin: 0 auto; padding: 0 16px 64px; }
        .card { background: var(--card); border-radius: 20px; padding: 28px;
            box-shadow: 0 10px 40px rgba(99, 102, 241, .12); }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .toolbar .count { color: var(--muted); font-size: .92rem; }
        .btn { display: inline-block; padding: 10px 20px; border-radius: 12px; border: 0; cursor: pointer;
            font: inherit; font-weight: 500; text-decoration: none; transition: .2s;
            background: var(--primary); color: #fff; }
        .btn:hover { background: var(--primary-dark); transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, .35); }
        .btn.ghost { background: #eef2ff; color: var(--primary-dark); }
        .btn.ghost:hover { background: #e0e7ff; box-shadow: none; }
        .btn.danger { background: #fee2e2; color: var(--danger); }
        .btn.danger:hover { background: var(--danger); color: #fff; box-shadow: none; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: .8rem; letter-spacing: .05em; color: var(--muted);
            padding: 10px 12px; border-bottom: 2px solid var(--border); }
        td { padding: 14px 12px; border-bottom: 1px solid var(--border); }
        tbody tr { transition: background .15s; }
        tbody tr:hover { background: #f5f3ff; }
        td.no { width: 70px; color: var(--muted); }
        td.date { width: 130px; color: var(--muted); font-size: .9rem; }
        td.name { width: 120px; }
        td a { color: var(--text); text-decoration: none; font-weight: 500; }
        td a:hover { color: var(--primary); }
        .empty { text-align: center; padding: 56px 0; color: var(--muted); }
        .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 26px; flex-wrap: wrap; }
        .pagination a, .pagination span { min-width: 38px; height: 38px; padding: 0 10px; display: grid;
            place-items: center; border-radius: 10px; text-decoration: none; color: var(--text);
            background: #f3f4f6; font-weight: 500; }
        .pagination a:hover { background: #e0e7ff; color: var(--primary-dark); }
        .pagination .active { background: var(--primary); color: #fff; }
        .pagination .disabled { opacity: .4; }
        label { display: block; margin: 18px 0 6px; font-weight: 500; }
        input[type=text], textarea { width: 100%; padding: 12px 14px; font: inherit; border-radius: 12px;
            border: 1.5px solid var(--border); background: #fafafa; transition: .2s; }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); background: #fff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, .15); }
        textarea { min-height: 240px; resize: vertical; }
        .error { color: var(--danger); font-size: .85rem; margin-top: 4px; }
        .actions { display: flex; gap: 8px; margin-top: 26px; justify-content: flex-end; }
        .post-title { margin: 0 0 12px; font-size: 1.6rem; }
        .meta { display: flex; gap: 14px; color: var(--muted); font-size: .9rem; padding-bottom: 16px;
            border-bottom: 1px solid var(--border); }
        .body { padding: 24px 0; line-height: 1.8; white-space: pre-wrap; word-break: break-word; min-height: 160px; }
        @media (max-width: 600px) { td.date, th.date { display: none; } .card { padding: 18px; } }
    </style>
</head>
<body></body>
</html>
